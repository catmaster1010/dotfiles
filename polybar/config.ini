[colors]
background = #282A2E
background-alt = #373B41
foreground = #C5C8C6
alert = #ff0000
secondary = #8ABEB7
primary = #ff0000
disabled = #707880

green = #a6d189
yellow = #e5c890
orange = #ef9f76
red = #e78284

[bar/main]
width = 100%
height = 20pt

locale = ja_JP.UTF-8

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-color = #00000000

padding-left = 0
padding-right = 0

module-margin = 0

separator = 
separator-foreground = ${colors.disabled}

font-0 = monospace:size=12
font-1 = "Symbols Nerd Font Mono:1"
font-2 = "SourceHanSansJP-Regular.otf: "Source Han Sans JP" "Regular""

modules-left = ytb xworkspaces 
modules-right = xkeyboard filesystem pulseaudio  memory cpu bluetooth network battery weather date tray

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/tray]
type = internal/tray

[module/weather]
type = custom/script
exec = ~/.config/polybar/weather-polybar-plugin/weather-plugin.sh

tail = false
interval = 960

[module/powermenu]
type = custom/menu

expand-right = true

format-spacing = 1

label-open = ""
label-open-foreground = ${colors.urgent}
label-close =  
label-close-foreground = ${colors.success}
label-separator = 
label-separator-foreground = ${colors.foreground}

;Powermenu
menu-0-0 = "󰜉"
menu-0-0-exec = #powermenu.open.1
menu-0-0-foreground = ${colors.urgent}

menu-0-1 = ""
menu-0-1-exec = #powermenu.open.2
menu-0-1-foreground = ${colors.urgent}

menu-0-2 = "󰒲"
menu-0-2-exec = #powermenu.open.3
menu-0-2-foreground = ${colors.warning}

;Reboot
menu-1-0 = ""
menu-1-0-exec = #powermenu.open.0
menu-1-0-foreground = ${colors.success}
menu-1-1 = "Reboot"
menu-1-1-exec = systemctl reboot
menu-1-1-foreground = ${colors.urgent}

;Shutdown
menu-2-1 = "Shutdown"
menu-2-1-exec = systemctl poweroff
menu-2-1-foreground = ${colors.urgent}
menu-2-0 = ""
menu-2-0-exec = #powermenu.open.0
menu-2-0-foreground = ${colors.success}

;Suspend
menu-3-1 = "Suspend"
menu-3-1-exec = systemctl suspend
menu-3-1-foreground = ${colors.urgent}
menu-3-0 = ""
menu-3-0-exec = #powermenu.open.0
menu-3-0-foreground = ${colors.success}

[module/sepr]
type = custom/text
content = "] "
content-foreground = #414559
[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#f00}%mountpoint%%{F-} %percentage_used%%


label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
label-volume =  %{F#f00}󰕾%{F-} %percentage%%
label-muted = 󰖁 Muted
format-muted-foreground = ${colors.red}


[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "󰍛"
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "󰻠"
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected
[module/network]
type = internal/network
interface = wlan0
interface-type = wireless
interval = 1.0
label-connected = %{F#f00} %{F-}%local_ip%
format-connected-foreground = ${colors.green}
label-disconnected = 󰖪 Disconnected
format-disconnected-foreground = ${colors.red}

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected =  %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%


[module/date]
type = internal/date
interval = 1.0
date =%{F#f00}%{F-} %H:%M:%S
date-alt = %{F#f00}%{F-} %H:%M:%S %a, %d %b %Y

[settings]
screenchange-reload = true
pseudo-transparency = true


[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/bluetooth.sh
interval = 60
click-left = exec blueman-manager
click-right = exec ~/.config/polybar/toggle_bluetooth.sh
format-foreground = #ffffff

[module/battery]
type = internal/battery
full-at = 100
low-at = 23
battery = BAT1
adapter = AC
poll-interval = 5
label-full = 󰁹%{F-} %percentage%%
format-full-foreground = ${colors.green}
label-charging = 󰂄%{F-} %percentage%%
format-charging-foreground = ${colors.yellow}
label-discharging = 󰂀%{F-} %percentage%%
format-discharging-foreground = ${colors.orange}
label-low = 󰁻%{F-} %percentage%%
format-low-foreground = ${colors.red}


